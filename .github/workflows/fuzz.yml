name: Fuzz

# Atheris (libFuzzer for Python) on the ingest parsers. Scorecard's Fuzzing check
# recognises `import atheris` in a *.py file; this workflow makes sure the target is
# built and run on every change to it, and weekly against whatever the parsers became.

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "src/diploma_equivalence/infrastructure/ingest/**"
      - "uv.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "0 8 * * 3" # weekly Wednesday 08:00 UTC
  workflow_dispatch:

# Deny-all at workflow scope; the job re-grants the minimum it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atheris:
    name: Atheris (ingest parsers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install the fuzz group (hash-locked, no torch)
        run: uv sync --frozen --only-group fuzz --python 3.12

      - name: Fuzz the ingest parsers
        env:
          PYTHONPATH: src
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: uv run --no-sync python fuzz/fuzz_ingest_parsers.py -max_total_time="$FUZZ_SECONDS" -timeout=10 -rss_limit_mb=2048
