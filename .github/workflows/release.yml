name: Release attestation

# Build the Docker image, then publish build-provenance + SBOM attestations
# bound to its registry digest. Triggers ONLY on a version tag (vX.Y.Z) or a
# manual dispatch — never on pull_request — so merging publishes nothing until
# a release is deliberately cut. Never re-tag a release: cut vX.Y.Z+1 on a
# botched publish (stale provenance otherwise).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Deny-all at workflow scope; the job re-grants the minimum it needs.
permissions: {}

# Serialize releases per ref; never cancel a publish in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest:
    name: build + provenance + SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      id-token: write # OIDC signing for the attestations
      attestations: write # publish provenance + SBOM attestations
      packages: write # push the image to GHCR
    env:
      # github.* values are bound to env (never interpolated into run: directly)
      # so a crafted ref/actor cannot inject shell.
      REGISTRY: ghcr.io
      REPO: ${{ github.repository }}
      GIT_SHA: ${{ github.sha }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compute build metadata
        id: meta
        run: |
          set -euo pipefail
          # Only publish from a tag or main; refuse a dispatch on any other branch.
          if [ "$REF_TYPE" != "tag" ] && [ "$REF_NAME" != "main" ]; then
            echo "::error::release dispatch only allowed on main (got '$REF_NAME')"
            exit 1
          fi
          image="$(printf '%s/%s' "$REGISTRY" "$REPO" | tr '[:upper:]' '[:lower:]')"
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="0.1.0-dispatch.$(git rev-parse --short HEAD)"
          fi
          # Refuse to build/push/move :latest for a non-semver tag (typo guard).
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::refusing to publish non-semver version '$version'"
            exit 1
          fi
          epoch="$(git log -1 --format=%ct)"
          {
            echo "image=$image"
            echo "version=$version"
            echo "epoch=$epoch"
            echo "build_date=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin

      - name: Build and push image
        id: build
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          # BuildKit reads SOURCE_DATE_EPOCH from the environment to normalize
          # layer timestamps, making the image bytes reproducible across rebuilds.
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        run: |
          set -euo pipefail
          tags="--tag $IMAGE:$VERSION"
          if [ "$REF_TYPE" = "tag" ]; then
            tags="$tags --tag $IMAGE:latest"
          fi
          # shellcheck disable=SC2086  # $tags is an intentional word-split flag list
          docker buildx build \
            --label org.opencontainers.image.revision="$GIT_SHA" \
            --label org.opencontainers.image.source="https://github.com/$REPO" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.created="$BUILD_DATE" \
            $tags \
            --push \
            --provenance=false \
            --metadata-file "$RUNNER_TEMP/build-meta.json" \
            .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build-meta.json")"
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "::error::failed to resolve pushed image digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

      # Provenance first — it is independent of the SBOM, so a syft hiccup can
      # never skip it.
      #
      # GitHub-native attestation persistence requires a public repo or a paid
      # org plan; on a private free-org repo it errors ("Feature not available
      # for the organization"). Gate the attest + verify steps on visibility so
      # a private release still builds + pushes the image and generates SBOMs;
      # going public or upgrading the plan re-activates attestation automatically.
      - name: Attest build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # SBOM from the source tree (pyproject + uv.lock), NOT a docker export of
      # the image: the ML image is multi-GB and syft's image export blows the
      # runner disk ("no space left on device"). Source-scan is robust and is
      # still attested against the image digest.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      # actions/attest-sbom is deprecated; the unified actions/attest takes the
      # SBOM via sbom-path and sets the CycloneDX/SPDX predicate-type itself.
      - name: Attest SBOM (CycloneDX)
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Attest SBOM (SPDX)
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      # Self-proving evidence: crypto-verify each attestation (signature +
      # signer identity = this repo's workflow) against the pushed digest using
      # the job's own GITHUB_TOKEN. Fails loud if any attestation is missing.
      - name: Verify attestations
        if: ${{ github.event.repository.visibility == 'public' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.build.outputs.ref }}
        run: |
          set -euo pipefail
          for pt in \
            https://slsa.dev/provenance/v1 \
            https://cyclonedx.org/bom \
            https://spdx.dev/Document/v2.3; do
            echo "::group::verify $pt"
            gh attestation verify "oci://$REF" --repo "$REPO" --predicate-type "$pt"
            echo "::endgroup::"
          done

      - name: Note attestation skipped (private repo)
        if: ${{ github.event.repository.visibility != 'public' }}
        run: |
          echo "::warning::Release attestation + verification skipped: GitHub-native attestation needs a public repo or a paid org plan; this repo is private on a free org. The image was built, pushed, and CycloneDX + SPDX SBOMs generated. Restore full attestation by making the repo public, upgrading the org plan, or adding cosign keyless signing as a private-repo fallback."
