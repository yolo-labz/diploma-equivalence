name: Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build + smoke test Dokku image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Free runner disk
        # Heavy image (ffmpeg + libsndfile1 + full uv venv + bytecode + buildx
        # layers + load:true) exhausts the ~14 GB runner disk -> the build step
        # died with "No space left on device". Reclaim ~25 GB of unused SDKs.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Capture build provenance
        id: prov
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          echo "git_sha=${GH_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image (Dokku Dockerfile)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: Dockerfile.dokku
          push: false
          load: true
          tags: diploma-equivalence:ci
          build-args: |
            APP_VERSION=0.1.0
            GIT_SHA=${{ steps.prov.outputs.git_sha }}
            BUILD_DATE=${{ steps.prov.outputs.build_date }}

      - name: Smoke run + healthcheck
        env:
          EXPECTED_SHA: ${{ steps.prov.outputs.git_sha }}
        run: |
          set -euo pipefail
          docker run -d --name diploma-test -p 5000:5000 diploma-equivalence:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              break
            fi
            sleep 1
            if [ "$i" = "30" ]; then
              echo "service did not become healthy in 30s"
              docker logs diploma-test
              exit 1
            fi
          done
          curl -fsS http://localhost:5000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:5000/version | tee /dev/stderr | grep -q "$EXPECTED_SHA"

      - name: Tear down
        if: always()
        run: docker rm -f diploma-test || true
